memory:
  window-size: 6
  # 滚动摘要：滑出窗口的旧消息由 LLM 压缩为摘要注入 system prompt
  summary:
    enabled: true
    model: qwen-turbo
    max-chars: 800
  # 情景记忆：历史问答归档进 Milvus，供 Agent 跨会话检索
  episodic:
    enabled: true
    top-k: 3
    min-score: 0.5

experience:
  enabled: true
  recall:
    top-k: 5
    min-score: 0.6
    # 时间新近因子：finalScore = 相似度 × 置信度 × recency
    recency:
      half-life-days: 14   # 距上次使用每过 14 天，时间因子衰减一半
      floor: 0.3           # 因子下限，老经验不会被完全压死
  distill:
    min-confidence: 0.6
    new-pattern-threshold: 0.5
    update-threshold: 0.85 # 与已有经验相似度达到该值时合并更新而非新增
  temp:
    ttl-days: 365          # 仅用于清理 experience_temp 存量数据（弱经验现已直接入 Milvus）
  # 弱触发经验：入 Milvus 参与召回（tier=weak、置信度打折），评分成功后晋升 strong
  weak:
    initial-factor: 0.7    # 弱经验初始置信度 = 提炼置信度 × 该系数
    promote-confidence: 0.7 # 置信度达到该值后 weak 晋升为 strong
  decay:
    cron: "0 0 3 * * *"
    idle-days: 30
    factor: 0.95
  model: qwen-turbo
