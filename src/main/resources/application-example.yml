# 配置示例：复制为 application.yml 后填入真实值（application.yml 含密钥，勿提交到 Git）
#
#   cp src/main/resources/application-example.yml src/main/resources/application.yml
#   cp src/main/resources/mcp-servers.json.example src/main/resources/mcp-servers.json
#   # 编辑 mcp-servers.json，填入腾讯云 SecretId / SecretKey
#
server:
  port: 9900
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  upload:
    path: ./uploads
    allowed-extensions: txt,md,markdown,pdf,doc,docx

# 聊天附件（不入知识库）：单轮拼进模型的文本上限、最多文件数
chat:
  attachment:
    max-chars: 24000
    max-files: 5

milvus:
  host: 192.168.150.101          # Milvus 所在主机 IP（本机 Docker 填 localhost）
  port: 19530
  username: ""
  password: ""
  database: default
  timeout: 10000

spring:
  # 文件上传大小上限（与前端 50MB 限制对齐，Spring Boot 默认仅 1MB）
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:mysql://192.168.150.101:3306/superbiz_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: ""                   # MySQL 密码
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 10
  sql:
    init:
      mode: always
      continue-on-error: false
  ai:
    # 禁止 DashScope / OpenAI 自动注册全局 ChatModel，对话与 AI Ops 由 ChatModelFactory 按 provider 创建
    model:
      chat: none
    openai:
      api-key: ${llm.deepseek.api-key:your-openai-compatible-api-key}
      base-url: https://api.deepseek.com
    dashscope:
      api-key: your-dashscope-api-key
      chat:
        options:
          model: qwen-plus
          timeout: 180000
      retry:
        max-attempts: 3
        backoff:
          initial-interval: 2000
          multiplier: 2
          max-interval: 10000

    # Spring AI MCP 客户端配置（CLS 本地 stdio，仅支持 command/args/env 三字段）
    mcp:
      client:
        enabled: true
        name: tencent-mcp-server
        version: 1.0.0
        request-timeout: 60s
        type: ASYNC
        stdio:
          connections:
            cls-mcp-server:
              command: ${MCP_NODE_HOME:C:/nvm4w/nodejs}/node.exe
              args:
                - scripts/cls-mcp-stdio-wrapper.cjs
              env:
                MCP_NPX: ${MCP_NODE_HOME:C:/nvm4w/nodejs}/npx.cmd
                CLS_MCP_PACKAGE: cls-mcp-server@latest
                TRANSPORT: stdio
                TENCENTCLOUD_SECRET_ID: ${TENCENTCLOUD_SECRET_ID:your-secret-id}
                TENCENTCLOUD_SECRET_KEY: ${TENCENTCLOUD_SECRET_KEY:your-secret-key}
                TZ: Asia/Shanghai

# 对话 / AI Ops 可切换；经验提炼固定 DeepSeek。Embedding / Rerank 仍走 DashScope。
llm:
  default-provider: deepseek
  dashscope:
    chat-model: qwen-plus
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}          # DeepSeek API Key
    base-url: https://api.deepseek.com
    chat-model: deepseek-v4-flash
    thinking: false                  # 非思考（原 deepseek-chat）；true 为思考模式（原 deepseek-reasoner）

dashscope:
  api:
    key: your-dashscope-api-key
  embedding:
    model: qwen3.7-text-embedding

document:
  chunk:
    max-size: 800
    overlap: 100
  # 知识库解析对比：关=PDFBox/Tika 基线；开=入库前调本地 PaddleOCR-VL 或 MinerU。
  # 8G 显存一次只开一个引擎。isolate-collection=true 时写入 biz / biz_paddle / biz_mineru，互不覆盖。
  parse:
    enabled: false
    engine: baseline          # baseline | paddle | mineru；MinerU VLM 预加载后改 enabled=true、engine=mineru
    fallback-to-baseline: true
    isolate-collection: true
    timeout-ms: 600000
    paddle:
      base-url: http://127.0.0.1:8080   # 已确认本机空闲
      path: /layout-parsing
      health-path: /health
      use-chart-recognition: true
      use-ocr-for-image-block: true
    mineru:
      base-url: http://127.0.0.1:8000   # 已确认本机空闲
      path: /file_parse
      health-path: /health
      backend: pipeline       # 本机 API：pipeline | vlm-engine | hybrid-engine；预加载 VLM 后用 vlm-engine
      parse-method: auto
      lang: ch
      formula-enable: true
      table-enable: true

rag:
  top-k: 3
  recall-top-k: 10
  hyde:
    enabled: true
    max-tokens: 400
  rerank:
    enabled: true
    model: qwen3-rerank
    instruct: "Given a web search query, retrieve relevant passages that answer the query."

aiops:
  docs:
    auto-import: true           # 启动与定时扫描 aiops-docs：新增入库、删除去向量、文件变化则重建
    path: ./aiops-docs
    sync-interval-ms: 1800000   # 30 分钟；首次延迟同样时长，避免与启动扫描重叠
  # 一键排障编排（告警接入 → 根因分析 → 处置决策(LLM选模板填参) → 规划落地 → 风险分级 → 执行 → 验证 → 沉淀）
  # 详见 docs/一键排障编排方案.md。LLM 出现在根因分析、处置决策与经验提炼。
  orchestration:
    rca:                          # 节点 ② 根因分析引擎
      engine: plan-execute        # plan-execute = Planner/Executor/Supervisor 规划→执行→再规划；react = 单个 ReactAgent
      recursion-limit: 40         # 内层 Supervisor 图最多走多少步（Planner / Executor 各算一步）
      timeout-seconds: 480        # RCA 环节墙钟上限，超时即失败（SSE 总超时 600s）
      heartbeat-seconds: 30       # 等待期间每隔多久向 SSE 推一行心跳
      extract-conclusion-with-llm: true   # 报告尾部缺 JSON 结论时，再用一次无工具 LLM 调用从报告抽取
      temperature: 0.3
      max-tokens: 8000
    remediation:
      enabled: true               # false = 只 dry-run（不连 SSH、不执行、不做前置检查）；true 才会真正下发 playbook
      auto-execute-levels: [L0, L1]   # 这些等级自动执行；L2 进入人工审批（两段式，POST /api/incidents/{id}/approve）
      min-confidence-for-auto: 0.7    # RCA 置信度低于该值强制提升为 L2
      ssh:                        # 自愈命令下发到哪台机器（tjxt 全栈虚机），凭据勿提交
        host: 10.195.86.203
        port: 10023
        username: root
        password: ${TJXT_SSH_PASS:}
        connect-timeout-ms: 10000
        command-timeout-ms: 120000
        max-output-chars: 2000
      circuit-breaker:
        max-executions-per-hour: 10  # 同一 playbook + 目标 1 小时内最多执行次数，超过则 NO_ACTION
      verify:
        timeout-seconds: 150        # 轮询 Prometheus 等告警 resolved 的上限
        interval-seconds: 15
      max-replans: 3                # L2「其他建议」回到决策节点重选的次数上限
    topology:                     # 服务依赖拓扑：把多条告警归并为「根候选」与「症状」
      alert-components:           # alertname → 组件
        MySQLDown: mysql
        MySQLSlowQueries: mysql
        RedisDown: redis
        RabbitMQDown: rabbitmq
        ServiceUnavailable: course
        NacosDown: nacos
      components:                 # depends-on 里的组件若也在告警，则本组件只是症状
        mysql:    { criticality: high,   depends-on: [], aliases: [mysqld, "3306"] }
        redis:    { criticality: high,   depends-on: [], aliases: ["6379"] }
        rabbitmq: { criticality: high,   depends-on: [], aliases: [mq, rabbit, "5672", "15672"] }
        nacos:    { criticality: high,   depends-on: [], aliases: ["8848"] }
        course:   { criticality: medium, depends-on: [mysql, redis, rabbitmq, nacos], aliases: [course-service, tj-course, cs] }
        auth:     { criticality: medium, depends-on: [mysql, redis, nacos], aliases: [auth-service, tj-auth] }
        user:     { criticality: medium, depends-on: [mysql, redis, nacos], aliases: [user-service, tj-user] }
        trade:    { criticality: medium, depends-on: [mysql, redis, rabbitmq, nacos], aliases: [trade-service, tj-trade] }
        pay:      { criticality: medium, depends-on: [mysql, redis, rabbitmq, nacos], aliases: [pay-service, tj-pay] }
        gateway:  { criticality: high,   depends-on: [nacos, course, auth, user, trade, pay], aliases: [gateway-service, tj-gateway] }
    playbooks:                    # 自愈只能从这里选模板并填 {param}，不能自由生成命令；risk 决定自动执行还是人工审批
      - id: start-mysql-container
        title: 启动已停止的 MySQL 容器
        component: mysql
        target: "{container}"
        risk: L1
        match-alerts: [MySQLDown]
        params:
          container: { description: 容器名, choices: [mysql], default-value: mysql }
        precondition: "docker inspect -f '{{.State.Status}}' {container}"   # 容器已在 running 则不适用
        precondition-expect: "^(exited|created|dead)$"
        commands: ["docker start {container}"]
        verify-command: "docker inspect -f '{{.State.Status}}' {container}"
        verify-expect: "^running$"
        rollback: "docker stop {container}（恢复到执行前的停止状态）"
        expected-effect: "mysql_up 恢复为 1，MySQLDown 在 2 分钟内 resolved，依赖 MySQL 的服务恢复"
      - id: start-redis-container
        title: 启动已停止的 Redis 容器
        component: redis
        target: "{container}"
        risk: L1
        match-alerts: [RedisDown]
        params:
          container: { description: 容器名, choices: [redis], default-value: redis }
        precondition: "docker inspect -f '{{.State.Status}}' {container}"
        precondition-expect: "^(exited|created|dead)$"
        commands: ["docker start {container}"]
        verify-command: "docker inspect -f '{{.State.Status}}' {container}"
        verify-expect: "^running$"
        rollback: "docker stop {container}"
        expected-effect: "redis_up 恢复为 1，RedisDown 在 2 分钟内 resolved"
      - id: start-rabbitmq-container
        title: 启动已停止的 RabbitMQ 容器（容器名 mq）
        component: rabbitmq
        target: "{container}"
        risk: L1
        match-alerts: [RabbitMQDown]
        params:
          container: { description: 容器名, choices: [mq], default-value: mq }
        precondition: "docker inspect -f '{{.State.Status}}' {container}"
        precondition-expect: "^(exited|created|dead)$"
        commands: ["docker start {container}"]
        verify-command: "docker inspect -f '{{.State.Status}}' {container}"
        verify-expect: "^running$"
        rollback: "docker stop {container}"
        expected-effect: "RabbitMQDown 在 2 分钟内 resolved，支付/消息类业务恢复"
      - id: start-course-service
        title: 启动已停止的 course-service 容器（tj-course）
        component: course
        target: "{container}"
        risk: L1
        match-alerts: [ServiceUnavailable]
        match-keywords: [course-service, tj-course, "/cs/"]
        params:
          container: { description: 容器名, choices: [tj-course], default-value: tj-course }
        precondition: "docker inspect -f '{{.State.Status}}' {container}"
        precondition-expect: "^(exited|created|dead)$"
        commands: ["docker start {container}"]
        verify-command: "docker inspect -f '{{.State.Status}}' {container}"
        verify-expect: "^running$"
        rollback: "docker stop {container}"
        expected-effect: "course-service 重新注册到 Nacos，网关 /cs/** 恢复 200"
      - id: mysql-raise-max-connections
        title: 调大 MySQL max_connections 缓解连接打满
        component: mysql
        target: mysql
        risk: L2                  # 改运行参数：必须人工审批
        match-keywords: ["Too many connections", max_connections, 连接打满, 连接耗尽, 连接数过多]
        params:
          container: { description: MySQL 容器, choices: [mysql], default-value: mysql }
          max_connections: { description: 新的全局连接上限, choices: ["300", "500", "800"], default-value: "500" }
        precondition: "docker inspect -f '{{.State.Status}}' {container}"
        precondition-expect: "^running$"
        commands:
          - "docker exec {container} sh -c 'mysql -uroot -p\"$MYSQL_ROOT_PASSWORD\" -e \"SET GLOBAL max_connections={max_connections}; SHOW VARIABLES LIKE \\\"max_connections\\\";\"'"
        verify-command: "docker exec {container} sh -c 'mysql -uroot -p\"$MYSQL_ROOT_PASSWORD\" -N -e \"SELECT @@max_connections\"'"
        verify-expect: "^{max_connections}$"
        rollback: "SET GLOBAL max_connections=151（原默认值）"
        expected-effect: "新连接可建立，Too many connections 停止刷新；仍需排查连接泄漏（SHOW PROCESSLIST）"
      - id: mysql-add-course-name-index
        title: 为 tj_course.course.name 补二级索引
        component: mysql
        target: mysql
        risk: L2
        match-alerts: [MySQLSlowQueries]
        match-keywords: [慢查询, Query_time, Rows_examined, tj_course.course, course.name, 缺索引, 全表扫, GROUP BY, 按名聚合]
        params:
          container: { description: MySQL 容器, choices: [mysql], default-value: mysql }
          schema: { description: 库名, choices: [tj_course], default-value: tj_course }
          table: { description: 表名, choices: [course], default-value: course }
          index: { description: 索引名, choices: [idx_name], default-value: idx_name }
          column: { description: 列名, choices: [name], default-value: name }
        precondition: "docker exec {container} sh -c 'mysql -uroot -p\"$MYSQL_ROOT_PASSWORD\" -N -e \"SELECT COUNT(*) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA=\\\"{schema}\\\" AND TABLE_NAME=\\\"{table}\\\" AND INDEX_NAME=\\\"{index}\\\"\"'"
        precondition-expect: "^0$"
        commands:
          - "docker exec {container} sh -c 'mysql -uroot -p\"$MYSQL_ROOT_PASSWORD\" -e \"ALTER TABLE {schema}.{table} ADD INDEX {index} ({column}); SHOW INDEX FROM {schema}.{table};\"'"
        verify-command: "docker exec {container} sh -c 'mysql -uroot -p\"$MYSQL_ROOT_PASSWORD\" -N -e \"SELECT INDEX_NAME FROM information_schema.STATISTICS WHERE TABLE_SCHEMA=\\\"{schema}\\\" AND TABLE_NAME=\\\"{table}\\\" AND INDEX_NAME=\\\"{index}\\\" LIMIT 1\"'"
        verify-expect: "^{index}$"
        rollback: "ALTER TABLE {schema}.{table} DROP INDEX {index}"
        expected-effect: "按课程名前缀检索或 GROUP BY name 不再全表扫描 tj_course.course；慢日志里针对 name 的 SELECT 应下降"
      - id: mysql-add-order-user-index
        title: 为 tj_trade.order.user_id 补二级索引
        component: mysql
        target: mysql
        risk: L2
        match-keywords: [tj_trade.order, order.user_id, 订单慢查询]
        params:
          container: { description: MySQL 容器, choices: [mysql], default-value: mysql }
          schema: { description: 库名, choices: [tj_trade], default-value: tj_trade }
          table: { description: 表名, choices: [order], default-value: order }
          index: { description: 索引名, choices: [idx_user_id], default-value: idx_user_id }
          column: { description: 列名, choices: [user_id], default-value: user_id }
        precondition: "docker exec {container} sh -c 'mysql -uroot -p\"$MYSQL_ROOT_PASSWORD\" -N -e \"SELECT COUNT(*) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA=\\\"{schema}\\\" AND TABLE_NAME=\\\"{table}\\\" AND INDEX_NAME=\\\"{index}\\\"\"'"
        precondition-expect: "^0$"
        commands:
          - "docker exec {container} sh -c 'mysql -uroot -p\"$MYSQL_ROOT_PASSWORD\" -e \"ALTER TABLE {schema}.\\`{table}\\` ADD INDEX {index} ({column}); SHOW INDEX FROM {schema}.\\`{table}\\`;\"'"
        verify-command: "docker exec {container} sh -c 'mysql -uroot -p\"$MYSQL_ROOT_PASSWORD\" -N -e \"SELECT INDEX_NAME FROM information_schema.STATISTICS WHERE TABLE_SCHEMA=\\\"{schema}\\\" AND TABLE_NAME=\\\"{table}\\\" AND INDEX_NAME=\\\"{index}\\\" LIMIT 1\"'"
        verify-expect: "^{index}$"
        rollback: "ALTER TABLE {schema}.`{table}` DROP INDEX {index}"
        expected-effect: "按 user_id 查订单不再全表扫描 tj_trade.order"

prometheus:
  # 远端 tjxt 宿主机映射的 Prometheus，不要走本机 127.0.0.1 或经验库虚机 192.168.150.101
  base-url: http://10.195.86.203:9090
  timeout: 15

# CLS 云日志服务配置
# 日志集 ID / 主题 ID：CLS 控制台 → 日志集/日志主题 → 基本信息
cls:
  region: ap-chengdu                    # 与日志集/主题所在地域一致
  logset-id: "bd870dc4-1b4d-4b60-b377-c7d1e297e9f4"
  topics:
    course-service: "142e7b44-5185-4131-9d7f-2f7b0f82261c"      # tjxt-dev-course-service-log-ap-chengdu
    data-service: "caf266a7-9302-4753-8607-561300e4f322"          # tjxt-dev-data-service-log-ap-chengdu
    exam-service: "8ef4182b-084a-4191-b066-28f4386c0c55"          # tjxt-dev-exam-service-log-ap-chengdu
    learning-service: "1a64cfbe-a7d8-4839-8f40-6032386edcc9"      # tjxt-dev-learning-service-log-ap-chengdu
    media-service: "f6f4fe96-76e6-4c74-8824-50f8af1062f2"         # tjxt-dev-media-service-log-ap-chengdu
    message-service: "eb1a9f24-84ac-432f-a18f-730149f00415"       # tjxt-dev-message-service-log-ap-chengdu
    pay-service: "b233a65c-1d1e-4ed1-81b1-e660608a5edc"            # tjxt-dev-pay-service-log-ap-chengdu
    promotion-service: "24327ea7-a905-4a69-a892-6ceb630cabb1"      # tjxt-dev-promotion-service-log-ap-chengdu
    remark-service: "6af851f9-6b03-4169-a789-b5de84134af8"         # tjxt-dev-remark-service-log-ap-chengdu
    search-service: "ac56ae07-8e02-46a5-becb-47e66f5c4090"        # tjxt-dev-search-service-log-ap-chengdu
    trade-service: "d50d23c8-1ae6-4d50-b7ac-0c3b7c282e10"          # tjxt-dev-trade-service-log-ap-chengdu
    user-service: "b835073e-660c-4dca-aaf9-403929ace17f"           # tjxt-dev-user-service-log-ap-chengdu
    gateway-service: "73ea9f48-b5a6-4704-99e2-1a0d5b69bf32"        # tjxt-dev-gateway-service-log-ap-chengdu
    auth-service: "68595b30-a1e3-4754-8fd6-8a305a288d28"          # tjxt-dev-auth-service-log-ap-chengdu
    mysql-slow: "9cddac58-51e9-442a-acc9-3f9ac1b24380"            # tjxt-dev-mysql-slow-log-ap-chengdu

memory:
  window-size: 6
  # 滚动摘要：滑出窗口的旧消息由 DeepSeek 压缩为摘要注入 system prompt
  summary:
    enabled: true
    max-chars: 800
  # 情景记忆：历史问答归档进 Milvus，供 Agent 跨会话检索
  episodic:
    enabled: true
    top-k: 3
    min-score: 0.5

experience:
  enabled: true
  recall:
    top-k: 5
    min-score: 0.6
    # 时间新近因子：finalScore = 相似度 × 置信度 × recency
    recency:
      half-life-days: 14   # 距上次使用每过 14 天，时间因子衰减一半
      floor: 0.3           # 因子下限，老经验不会被完全压死
  distill:
    min-confidence: 0.6
    new-pattern-threshold: 0.5
    update-threshold: 0.85 # 高相似且故障模式一致时合并；宕机 vs 连接打满不会合并
  temp:
    ttl-days: 365          # 仅用于清理 experience_temp 存量数据（弱经验现已直接入 Milvus）
  # 弱触发经验：新模式默认 weak，入 Milvus 参与召回（置信度打折），评分成功后晋升 strong
  weak:
    initial-factor: 0.7    # 弱经验初始置信度 = 提炼置信度 × 该系数
    promote-confidence: 0.7 # 置信度达到该值后 weak 晋升为 strong
  decay:
    cron: "0 0 3 * * *"
    idle-days: 30
    factor: 0.95
  # 经验提炼固定使用 llm.deepseek（deepseek-v4-flash 非思考），不再读取本项
