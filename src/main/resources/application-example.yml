# 配置示例：复制为 application.yml 后填入真实值（application.yml 含密钥，勿提交到 Git）
#
#   cp src/main/resources/application-example.yml src/main/resources/application.yml
#   cp src/main/resources/mcp-servers.json.example src/main/resources/mcp-servers.json
#   # 编辑 mcp-servers.json，填入腾讯云 SecretId / SecretKey
#
server:
  port: 9900
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  upload:
    path: ./uploads
    allowed-extensions: txt,md,markdown,pdf,doc,docx

milvus:
  host: 192.168.150.101          # Milvus 所在主机 IP（本机 Docker 填 localhost）
  port: 19530
  username: ""
  password: ""
  database: default
  timeout: 10000

spring:
  # 文件上传大小上限（与前端 50MB 限制对齐，Spring Boot 默认仅 1MB）
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:mysql://192.168.150.101:3306/superbiz_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: ""                   # MySQL 密码
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 10
  sql:
    init:
      mode: always
      continue-on-error: false
  ai:
    dashscope:
      api-key: your-dashscope-api-key
      chat:
        options:
          model: qwen-turbo
          timeout: 180000
      retry:
        max-attempts: 3
        backoff:
          initial-interval: 2000
          multiplier: 2
          max-interval: 10000

    # Spring AI MCP 客户端配置（CLS 本地 stdio，仅支持 command/args/env 三字段）
    mcp:
      client:
        enabled: true
        name: tencent-mcp-server
        version: 1.0.0
        request-timeout: 60s
        type: ASYNC
        stdio:
          connections:
            cls-mcp-server:
              command: ${MCP_NODE_HOME:C:/nvm4w/nodejs}/node.exe
              args:
                - scripts/cls-mcp-stdio-wrapper.cjs
              env:
                MCP_NPX: ${MCP_NODE_HOME:C:/nvm4w/nodejs}/npx.cmd
                CLS_MCP_PACKAGE: cls-mcp-server@latest
                TRANSPORT: stdio
                TENCENTCLOUD_SECRET_ID: ${TENCENTCLOUD_SECRET_ID:your-secret-id}
                TENCENTCLOUD_SECRET_KEY: ${TENCENTCLOUD_SECRET_KEY:your-secret-key}
                TZ: Asia/Shanghai

dashscope:
  api:
    key: your-dashscope-api-key
  embedding:
    model: text-embedding-v4

document:
  chunk:
    max-size: 800
    overlap: 100

rag:
  top-k: 3
  recall-top-k: 10
  model: "qwen3-max"
  rerank:
    enabled: true
    model: qwen3-rerank
    instruct: "Given a web search query, retrieve relevant passages that answer the query."

aiops:
  docs:
    auto-import: false
    path: ./aiops-docs

prometheus:
  base-url: http://192.168.150.101:9090
  timeout: 10
  mock-enabled: false

